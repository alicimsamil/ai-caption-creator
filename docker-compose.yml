version: "3.8"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://captionai:captionai@postgres:5432/captionai
      - OLLAMA_BASE_URL=http://ollama:11434
      - AI_SERVICE_URL=http://ai-service:8000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      ai-service:
        condition: service_started
    volumes:
      - uploads:/app/public/uploads
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=captionai
      - POSTGRES_PASSWORD=captionai
      - POSTGRES_DB=captionai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captionai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_NAME=Salesforce/blip-image-captioning-large
      - DEVICE=cpu
    volumes:
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  postgres-data:
  ollama-data:
  model-cache:
  uploads:
